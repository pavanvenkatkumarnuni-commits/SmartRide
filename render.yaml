services:
  - type: web
    name: smartride
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAPS_API_KEY
        sync: false
      - key: MAPS_PROVIDER
        value: google
